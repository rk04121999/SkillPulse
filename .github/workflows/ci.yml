name: Ronak CI Workflow

on: 
  push:

jobs:
    build-and-push: # jobs ka naam
        runs-on: ubuntu-latest  #github runner for free
        steps:
            - name: Checkout code
              uses: actions/checkout@v4   #clone the code into the ubuntu runner

            - name: setup docker
              uses: docker/setup-buildx-action@v4

            - name: login to docker hub
              uses: docker/login-action@v4
              with:
                username: ${{ secrets.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: push to docker hub
              uses: docker/build-push-action@v7
              with:
                context: ./backend
                push: true
                tags: ${{ secrets.DOCKERHUB_USERNAME }}/skillpulse-backend:latest 
                





